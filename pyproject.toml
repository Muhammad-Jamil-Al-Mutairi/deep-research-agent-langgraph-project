[project]
name = "hermes"
version = "0.1.0"
description = "HERMES - Autonomous Engineering Design & Verification Agent (SDAIA Agentic AI project)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # SDAIA starter dependencies (unchanged)
    "langchain>=1.4",
    "langgraph>=1.2.11",
    "langchain-openai>=1.2",
    "python-dotenv>=1.0",
    "beautifulsoup4>=4.12",
    "requests>=2.31",
    # HERMES additions
    "pydantic>=2.7",
    "langchain-text-splitters>=0.3",
    "chromadb>=1.0",
]

[project.optional-dependencies]
ui = [
    "streamlit>=1.50",
]

[dependency-groups]
dev = [
    "jupyterlab>=4",
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hermes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "rag: tests that build the Chroma index (downloads the local embedding model on first run)",
    "live: tests that call the real LLM (need OPENROUTER_API_KEY)",
]
addopts = "-m 'not live'"
